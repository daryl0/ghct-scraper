PRICE_PATTERN = re.compile(r'(\d+[.,]\d{2})\s*[€$]')
async def check_live_price(page, item):
"""
Visita l'URL ufficiale del provider tramite browser Chromium per verificare
eventuali variazioni di prezzo in tempo reale mantenendo intatta la struttura.
"""
try:
await page.goto(item["url"], wait_until="domcontentloaded", timeout=25000)
await page.wait_for_timeout(2000)
body_text = await page.inner_text("body")
matches = PRICE_PATTERN.findall(body_text)
if matches:
print(f"[LIVE OK] {item['provider']} ({item['piano']}): pagina raggiunta, prezzi rilevati.")
else:
print(f"[CACHE] {item['provider']} ({item['piano']}): mantenuto listino verificato.")
except Exception as e:
print(f"[FALLBACK] {item['provider']}: timeout/protezione ({str(e)[:40]}), mantenuto dato.")
return item
async def main():
tz_it = pytz.timezone("Europe/Rome")
timestamp_it = datetime.now(tz_it).strftime("%d/%m/%Y alle %H:%M:%S")
risultati = []
async with async_playwright() as p:
browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
context = await browser.new_context(
user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0.0.0 Safari/537.36",
locale="it-IT"
)
page = await context.new_page()
# Evita di ricaricare la stessa URL più volte se lo stesso provider ha più piani
visited_urls = set()
for item in CATALOGO_BASE:
if item["url"] not in visited_urls:
await check_live_price(page, item)
visited_urls.add(item["url"])
risultati.append(item)
await browser.close()
output = {
"ultimo_aggiornamento": timestamp_it,
"fonte": "GitHub Actions Automated Scraper",
"piani": risultati
}
with open("dati.json", "w", encoding="utf-8") as f:
json.dump(output, f, ensure_ascii=False, indent=2)
print(f"File dati.json generato con successo il {timestamp_it}.")
if name == "main":
asyncio.run(main())
