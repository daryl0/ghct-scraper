name: GHCT Scraper Live alle 24

on:
  schedule:
    # Esegue ogni giorno alle 23:00 UTC (corrispondenti alle 24:00 / 00:00 ora italiana)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Playwright e dipendenze
        run: |
          pip install playwright pytz
          playwright install chromium
          playwright install-deps chromium

      - name: Esegui lo scraper dai 10 URL
        run: python scraper.py

      - name: Salva dati.json nel repository GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GHCT Scraper Bot"
          git add dati.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Scraping live $(date +'%d/%m/%Y %H:%M')" && git push)

      - name: Carica dati.json su IONOS via SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Connessione SFTP a $SFTP_HOST con utente $SFTP_USER..."
          sudo apt-get update && sudo apt-get install -y lftp
          lftp --env-password -u "$SFTP_USER" sftp://"$SFTP_HOST":22 <<EOF
          set sftp:auto-confirm yes
          set ssl:verify-certificate no
          mkdir -p /clickandbuilds/GHCT/wp-content/uploads/ghct-data
          cd /clickandbuilds/GHCT/wp-content/uploads/ghct-data
          put dati.json
          bye
          EOF
