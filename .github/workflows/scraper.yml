name: GHCT Hosting Scraper & SFTP Deploy

on:
  schedule:
    # Esegue ogni giorno alle 23:00 UTC (24:00 / 00:00 ora italiana solare)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Playwright e Chromium
        run: |
          pip install playwright pytz
          playwright install chromium
          playwright install-deps chromium

      - name: Esegui lo scraper dei 10 provider
        run: python scraper.py

      - name: Backup dati.json sul repository GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GHCT Scraper Bot"
          git add dati.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento prezzi $(date +'%d/%m/%Y %H:%M')" && git push)

      - name: Carica dati.json su IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          local_path: './dati.json'
          remote_path: '/clickandbuilds/GHCT/wp-content/uploads/ghct-data'
          sftp_only: true
