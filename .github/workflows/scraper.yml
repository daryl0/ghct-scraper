name: Run Hosting Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push results if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hosting_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update hosting data json [skip ci]" && git push)
          - name: Upload JSON to IONOS Hosting via SFTP
        uses: cross-country/sftp-upload-action@v1 # o azioni simili di deploy SFTP
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          source: 'hosting_data.json'
          target: '/public_html/wp-content/uploads/ghct-data/hosting_data.json' # percorso sul server
