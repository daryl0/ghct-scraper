name: Run Hosting Scraper

on:
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub
  schedule:
    - cron: '0 6 * * 1' # Esegue ogni lunedì alle 06:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper script
        run: python scraper.py

      - name: Commit and push results if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hosting_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update hosting data json [skip ci]" && git push)
